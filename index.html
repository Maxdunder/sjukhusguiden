<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <title>Sundsvalls Sjukhus 3D</title>

    <link rel="stylesheet" href="index.css">

    <!-- Es-module-shims för importmap -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@v0.163.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@v0.163.0/examples/jsm/"
        }
      }
    </script>

    <style>
        body { margin:0; overflow:hidden; background:#111; font-family:sans-serif; }
        #progress-container {
            position:absolute;
            top:10px; left:50%;
            transform:translateX(-50%);
            color:white;
        }
        #ui-buttons button {
            padding:5px 10px;
            font-size:14px;
            cursor:pointer;
        }
    </style>
</head>
<body>

<div id="progress-container">Loading model...</div>

<!-- UI-knappar -->
<div id="ui-buttons" style="position:absolute; top:50px; left:10px; display:flex; flex-direction:column; gap:5px; z-index:100;">
    <button id="toggle-follow">Följ markör: ON</button>
    <button id="toggle-source">Källa: Wi-Fi</button>
</div>

<script type="module" src="main.js"></script>

</body>
</html>
