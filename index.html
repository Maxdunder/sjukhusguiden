<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Sundsvalls Sjukhus 3D</title>
<link rel="stylesheet" href="index.css">

<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@v0.163.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@v0.163.0/examples/jsm/"
  }
}
</script>

<style>
  body { margin:0; overflow:hidden; background:#111; font-family:sans-serif; }
  #progress-container {
    position:absolute; top:10px; left:50%;
    transform:translateX(-50%);
    color:white;
  }
  button { margin:2px; padding:5px 10px; }
</style>
</head>
<body>

<div id="progress-container">Laddar modell...</div>

<!-- Kontroller -->
<div id="controls" style="position:absolute; top:10px; left:10px; color:white;">
  <button id="toggle-follow">Följ markör: ON</button>
  <button id="toggle-source">Källa: Wi-Fi</button>
  <button id="set-spawn">Sätt spawnhöjd</button>
</div>

<!-- Slider för Wi-Fi känslighet -->
<div id="debug-controls" style="position:absolute; top:100px; left:10px; color:white; background:rgba(0,0,0,0.5); padding:10px; border-radius:5px; display:none;">
  <label for="step-slider">Wi-Fi känslighet: </label>
  <input type="range" id="step-slider" min="0.05" max="2" step="0.05" value="0.5">
  <span id="step-value">0.50</span>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
